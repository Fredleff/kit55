<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT55 | Truth. Accountability.</title>
  <meta name="description" content="KIT55: Supply chain infrastructure for projects that open cleanly. Truth and accountability, end to end.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
      color: #111111;
      background: #ffffff;
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 18px 40px;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-mark {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #111111;
      line-height: 1;
    }

    .contact-info {
      display: flex;
      gap: 32px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .contact-info a {
      color: #111111;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .contact-info a:hover {
      opacity: 0.6;
    }

    main {
      padding-top: 70px;
    }

    section {
      padding: 120px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    section.dark {
      background: #111111;
      color: #ffffff;
      max-width: 100%;
    }

    section.dark .inner {
      max-width: 900px;
      margin: 0 auto;
    }

    section.alt {
      background: #f5f5f5;
      color: #111111;
      max-width: 100%;
    }

    section.alt .inner {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
      line-height: 1.1;
    }

    h2 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
      line-height: 1.15;
    }

    p {
      font-size: 18px;
      margin-bottom: 24px;
      font-weight: 400;
      line-height: 1.75;
    }

    .divider {
      height: 1px;
      background: currentColor;
      opacity: 0.2;
      margin: 60px 0;
      max-width: 160px;
    }

    .seal {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 130px;
      height: 130px;
      transform: rotate(-15deg);
      z-index: 10;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .seal.visible {
      opacity: 1;
    }

    .cta-section {
      text-align: center;
      padding: 80px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .cta-section h2 {
      margin-bottom: 32px;
    }

    .contact-block {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .contact-block a {
      color: #111111;
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .contact-block a:hover {
      opacity: 0.6;
    }

    .footer {
      padding: 40px;
      text-align: center;
      font-size: 13px;
      color: #666666;
      background: #fafafa;
    }

    @media (max-width: 768px) {
      section {
        padding: 80px 24px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 32px;
      }

      h2 {
        font-size: 28px;
        margin-bottom: 28px;
      }

      p {
        font-size: 16px;
      }

      .nav {
        padding: 14px 24px;
      }

      .nav-inner {
        flex-direction: column;
        gap: 16px;
      }

      .contact-info {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .seal {
        width: 90px;
        height: 90px;
        bottom: 24px;
        right: 24px;
      }

      .cta-section {
        padding: 60px 24px;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <div class="logo-mark">KIT55</div>
      <div class="contact-info">
        <a href="tel:+18587442700">858-744-2700</a>
        <a href="mailto:welcome@mykit55.com">welcome@mykit55.com</a>
      </div>
    </div>
  </nav>
